[package]
name = "yield-vault"
version = "0.1.0"
edition = "2021"
description = "A Bitcoin implementation of ERC-4626 tokenized vault standard"
authors = ["Alkane Team"]
resolver = "2"  # Use new resolver for better WebAssembly support

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Standard crates from crates.io
anyhow = "1.0.94"
bitcoin = { version = "0.32.4", features = ["rand"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
hex = "0.4.3"
bitcoin_hashes = "0.12.0"

# Dependencies from GitHub - IRONCLAD RULE: never use local stubs for these
alkanes-runtime = { git = "https://github.com/kungfuflex/alkanes-rs" }
alkanes-support = { git = "https://github.com/kungfuflex/alkanes-rs" }
metashrew-support = { git = "https://github.com/sandshrewmetaprotocols/metashrew" }

# Local proc-macro crate
alkanes_proc_macros = { path = "src/proc_macros" }

[dev-dependencies]
once_cell = "1.19.0"
hex_lit = "0.1.1"
lazy_static = "1.4.0"
# Include main dependencies in dev-dependencies to ensure they're available for tests
alkanes-runtime = { git = "https://github.com/kungfuflex/alkanes-rs" }
alkanes-support = { git = "https://github.com/kungfuflex/alkanes-rs" }
metashrew-support = { git = "https://github.com/sandshrewmetaprotocols/metashrew" }

[build-dependencies]
anyhow = "1.0.94"
flate2 = "1.0"
hex = "0.4.3"

[features]
default = ["std"]  # Enable std by default
std = []  # Standard library feature
test = ["std"]

[profile.release]
opt-level = 's'       # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Maximize optimization
panic = 'abort'       # Smaller panic handler
strip = true          # Strip debug symbols

# WebAssembly-specific release profile
[profile.wasm-release]
inherits = "release"
opt-level = 'z'       # Maximum size optimization for WebAssembly
lto = true
codegen-units = 1
panic = 'abort'
strip = true

# Standard build on Linux uses secp256k1-sys from crates.io

[patch.crates-io]
secp256k1-sys = { path = "secp256k1-sys" }
