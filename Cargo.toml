[package]
name = "slop"
version = "0.1.0"
edition = "2021"
description = "Launchpad with Orbital Bond Factory"
authors = ["Erick"]
build = "build.rs"

[dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"
hex_lit = "0.1.1"

# Core alkanes runtime dependencies when blockchain feature is enabled
alkanes-runtime = { path = "../alkanes-rs/crates/alkanes-runtime", optional = true }
alkanes-support = { path = "../alkanes-rs/crates/alkanes-support", optional = true }
protorune-support = { path = "../alkanes-rs/crates/protorune-support", optional = true }
alkanes-macros = { path = "../alkanes-rs/crates/alkanes-macros" }

# Required for WebAssembly support - used directly by binary files
metashrew-support = { git = "https://github.com/sandshrewmetaprotocols/metashrew", rev = "56c61040", optional = true }

# External dependencies needed for the proc macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "1.0", features = ["full", "extra-traits"] }

# For testing
mockall = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockall = "0.11"
tempfile = "3.3"
proptest = "1.6.0"

[build-dependencies]
anyhow = "1.0"
flate2 = "1.0"
hex = "0.4"

[features]
default = ["blockchain"]
# Enable blockchain feature with all required dependencies
blockchain = ["alkanes-runtime", "alkanes-support", "protorune-support", "metashrew-support"]
testing = []

[[example]]
name = "launchpad_example"
path = "examples/launchpad_example.rs"
