[package]
name = "slop"
version = "0.1.0"
edition = "2021"
description = "Launchpad with Orbital Bond Factory"
authors = ["Erick"]

[dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"

# These dependencies are commented out for now since the paths don't exist in this environment
# alkanes-runtime = { path = "../alkanes-rs/crates/alkanes-runtime", optional = true }
# alkanes-support = { path = "../alkanes-rs/crates/alkanes-support", optional = true }
# metashrew-support = { path = "../alkanes-rs/crates/protorune-support", optional = true }

# Local mock implementation for alkanes

# For testing
mockall = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockall = "0.11"
tempfile = "3.3"
proptest = "1.2"

[features]
default = []
# blockchain feature temporarily disabled for local testing due to missing dependencies
# blockchain = ["alkanes-runtime", "alkanes-support", "metashrew-support"]
blockchain = []
testing = []

[[example]]
name = "launchpad_example"
path = "examples/launchpad_example.rs"
