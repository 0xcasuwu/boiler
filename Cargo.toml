[package]
name = "yield-vault"
version = "0.1.0"
edition = "2021"
description = "A Bitcoin implementation of ERC-4626 tokenized vault standard"
authors = ["Alkane Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Standard crates from crates.io
anyhow = "1.0.94"
bitcoin = { version = "0.32.4", features = ["rand"] }
serde_json = "1.0"
wasm-bindgen = "0.2.100"
hex = "0.4.3"
bitcoin_hashes = "0.12.0"

# Optional dependencies with path references
# Comment these out if not available locally
alkanes-support = { path = "./vendor/alkanes-rs/alkanes-support", optional = true }
alkanes-runtime = { path = "./vendor/alkanes-rs/alkanes-runtime", optional = true }
metashrew-support = { path = "./vendor/metashrew/metashrew-support", optional = true }
protorune-support = { path = "./vendor/alkanes-rs/protorune-support", optional = true }
ordinals = { path = "./vendor/alkanes-rs/ordinals", optional = true }

[dev-dependencies]
once_cell = "1.19.0"
wasm-bindgen-test = "0.3.40"
hex_lit = "0.1.1"
lazy_static = "1.4.0"

[build-dependencies]
anyhow = "1.0.94"
flate2 = "1.0"
hex = "0.4.3"

[features]
default = []
test = []

[profile.release]
opt-level = 's'       # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Maximize optimization
panic = 'abort'       # Smaller panic handler
strip = true          # Strip debug symbols

# Use relative path for secp256k1-sys to ensure cross-platform compatibility
[patch.crates-io]
secp256k1-sys = { path = "./fork-repos/secp256k1-sys" }
