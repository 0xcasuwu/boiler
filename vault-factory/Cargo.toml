[package]
name = "vault-factory"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alkanes-runtime = { git = "https://github.com/alkanes-io/alkanes-io", branch = "main" }
alkanes-support = { git = "https://github.com/alkanes-io/alkanes-io", branch = "main" }
metashrew-support = { git = "https://github.com/alkanes-io/alkanes-io", branch = "main" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hex = "0.4"
