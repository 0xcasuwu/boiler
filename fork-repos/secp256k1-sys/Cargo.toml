[package]
name = "secp256k1-sys"
version = "0.8.1"
edition = "2021"
authors = ["Fork Maintainers <maintainers@example.com>"]
description = "FFI bindings to libsecp256k1 - WebAssembly fork for Apple Silicon"
repository = "https://github.com/your-username/secp256k1-sys-wasm"
license = "Apache-2.0"
links = "secp256k1"
readme = "README.md"
build = "build.rs"

[lib]
name = "secp256k1_sys"
path = "src/lib.rs"

[dependencies]
# No external dependencies to reduce complexity

[features]
default = []
recovery = []
endomorphism = []
lowmemory = []
static-secp = []
std = []

[package.metadata.docs.rs]
features = ["recovery"]
