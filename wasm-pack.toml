# wasm-pack.toml - WebAssembly package configuration
# This file is used by wasm-pack to configure the output format

[package]
# Tell wasm-pack to only use essential features for WebAssembly
default-target = "bundler"
profile = "release"

# Configure WebAssembly target
[wasm]
# Skip the TypeScript type generation
# For Bitcoin contract WebAssembly, we don't need TypeScript types
skip-typescript = true

# Optimize for size rather than speed
[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

# For testing in Node.js environment
[test]
nodejs = true
